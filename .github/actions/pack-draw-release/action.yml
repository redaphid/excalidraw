name: Pack the draw release
description: Pack the five draw tarballs into release/ and verify them as the draw app consumes them.

inputs:
  version:
    description: Release version, such as 0.19.0-draw.21
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: node scripts/pack-draw-release.js --version="$VERSION"
    - name: Package versions agree
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        git diff --exit-code -- packages || {
          echo "::error::Packing rewrote package versions. Commit every package at $VERSION first."
          exit 1
        }
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: node scripts/verify-draw-release.js --version="$VERSION"
