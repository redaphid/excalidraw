name: CI

on:
  pull_request:
  push:
    branches: master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn test:typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No workflow publishes to npm
        run: bash scripts/check-no-npm-publish.sh
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: ./.github/actions/setup
      - name: ESLint
        run: yarn test:code
      - name: Prettier
        run: yarn test:other

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn test:app --watch=false --shard=${{ matrix.shard }}/3

  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn build:playground
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground
          path: playground/dist
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - run: yarn install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('e2e/yarn.lock') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground
          path: playground/dist
      - run: echo "### Long tasks, ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.browser }}-failures
          path: e2e/test-results
          retention-days: 14

  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build package JavaScript
        run: |
          for package in common fractional-indexing math element; do
            (cd "packages/$package" && node ../../scripts/buildBase.js)
          done
          cd packages/excalidraw && node ../../scripts/buildPackage.js
      - name: size-limit
        working-directory: packages/excalidraw
        shell: bash
        run: |
          status=0
          npx size-limit --json > "$RUNNER_TEMP/size.json" || status=$?
          node -e '
            console.log("| Check | Brotli bytes | Limit | Result |\n| --- | ---: | ---: | --- |");
            for (const c of require(process.argv[1])) {
              console.log(["", c.name, c.size, c.sizeLimit, c.passed ? "pass" : "OVER", ""].join(" | ").trim());
            }
          ' "$RUNNER_TEMP/size.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: version
        run: echo "version=$(node -p "require('./packages/excalidraw/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/pack-draw-release
        with:
          version: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draw-release-${{ steps.version.outputs.version }}
          path: release/*.tgz
          retention-days: 7

  # To make perf a gate, give it a pass/fail rule, delete continue-on-error,
  # and add "perf" to master's required status checks.
  perf:
    needs: playground
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - working-directory: perf-bench
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground
          path: perf-bench/builds/pr
      - shell: bash
        run: |
          {
            echo '```'
            node perf-bench/run.mjs --builds pr --runs 1 --throttle 1 --counters --label ci
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-bench-results
          path: perf-bench/results
          if-no-files-found: warn
          retention-days: 30
