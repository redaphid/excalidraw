name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master ($status). Tag a master commit."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - run: node scripts/semver/pack.js --version="${GITHUB_REF_NAME#v}"
      - run: node scripts/semver/verify.js --version="${GITHUB_REF_NAME#v}"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/semver/publish.js --version="${GITHUB_REF_NAME#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A create that failed partway leaves a draft, which a rerun replaces.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" release/*.tgz \
              --verify-tag --generate-notes --title "${GITHUB_REF_NAME#v}"
