name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/semver/pack.js --version="${GITHUB_REF_NAME#v}"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/semver/publish.js --version="${GITHUB_REF_NAME#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" release/*.tgz \
              --verify-tag --generate-notes --title "${GITHUB_REF_NAME#v}"
