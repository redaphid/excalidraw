name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # auto-release.yml calls this for each merge to master that needs a release.
  # A tag pushed with GITHUB_TOKEN starts no workflow, so the tag push above
  # fires only for a tag a person pushes.
  workflow_call:
    inputs:
      sha:
        description: The master commit to release.
        required: true
        type: string
      version:
        description: The version to release, without the v.
        required: true
        type: string
      bump:
        description: Commit bump.js on top of sha as github-actions and tag that commit. Master's required checks refuse a direct push, so the commit lives only on the tag.
        required: true
        type: boolean

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level, so a call from auto-release.yml cannot deadlock against the
    # caller's own group. Tag pushes and calls queue on the same group.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      CALLED: ${{ inputs.version && 'true' || 'false' }}
      SHA: ${{ inputs.sha || github.sha }}
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: The commit is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG would release $SHA, which is not on master ($status). Release a master commit."
            exit 1
          fi
      - name: Commit the version bump
        if: inputs.bump
        run: |
          node scripts/semver/bump.js "${TAG#v}"
          git add packages/*/package.json
          # A fixed identity and date make the commit, and so the tag, the same
          # on a rerun.
          date=$(git log -1 --format=%cI "$SHA")
          GIT_AUTHOR_NAME="github-actions[bot]" \
          GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" \
            git commit --no-verify -m "chore(repo): version the packages ${TAG#v}"
          git show --stat HEAD
      - name: The tag is free or already this release
        if: env.CALLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$release_sha" ]; then
            echo "::error::$TAG already points at $tagged, not $release_sha. Refusing to release a second build of $TAG."
            exit 1
          fi
          echo "$TAG -> $release_sha${tagged:+ (already tagged by a rerun or by hand)}"
      - uses: ./.github/actions/setup
      - run: node scripts/semver/pack.js --version="${TAG#v}"
      - run: node scripts/semver/typecheck-consumer.js --version="${TAG#v}"
      - run: node scripts/semver/verify.js --version="${TAG#v}"
      # Only after every check passes, so a failed check leaves no tag behind.
      - name: Push the tag
        if: env.CALLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$RELEASE_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/semver/publish.js --version="${TAG#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A create that failed partway leaves a draft, which a rerun replaces.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" release/*.tgz \
              --verify-tag --generate-notes --title "${TAG#v}"
